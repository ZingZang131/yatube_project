{% load static %}
{% with request.resolver_match.view_name as view_name %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <!-- Логотип -->
        <a class="navbar-brand fw-bold fs-3" href="/">
            <span class="bg-white text-primary rounded px-2 py-1 me-2">Я</span>tube
        </a>
        
        <!-- Кнопка для мобильных -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Навигация -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active fw-bold{% endif %}" href="/">
                        <i class="bi bi-house-door"></i> Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/groups/' in request.path %}active fw-bold{% endif %}" 
                       href="{% url 'posts:groups_all' %}">
                        <i class="bi bi-people"></i> Сообщества
                    </a>
                </li>
                <!-- ДОБАВЛЕНО: Об авторе -->
                <li class="nav-item">
                    <a class="nav-link {% if view_name == 'about:author' %}active fw-bold{% endif %}" 
                       href="{% url 'about:author' %}">
                        <i class="bi bi-person"></i> Об авторе
                    </a>
                </li>
                <!-- ДОБАВЛЕНО: Технологии -->
                <li class="nav-item">
                    <a class="nav-link {% if view_name == 'about:tech' %}active fw-bold{% endif %}" 
                       href="{% url 'about:tech' %}">
                        <i class="bi bi-gear"></i> Технологии
                    </a>
                </li>
            </ul>
            
            <!-- Поиск -->
            <form class="d-flex me-3" role="search" method="get" action="#">
                <input class="form-control me-2" type="search" placeholder="Поиск постов...">
                <button class="btn btn-outline-light" type="submit">Найти</button>
            </form>
            
            <!-- Профиль / Авторизация -->
            {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i> {{ user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <!-- ИСПРАВЛЕНО: ссылка на профиль -->
                        <li><a class="dropdown-item" href="{% url 'posts:profile' user.username %}">
                            <i class="bi bi-person"></i> Мой профиль
                        </a></li>
                        <li><a class="dropdown-item" href="#">
                            <i class="bi bi-pencil-square"></i> Новый пост
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <!-- ИСПРАВЛЕНО: форма для выхода -->
                        <li>
                            <form method="post" action="{% url 'users:logout' %}" class="m-0 p-0">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger w-100 text-start">
                                    <i class="bi bi-box-arrow-right"></i> Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <div>
                    <a href="{% url 'users:login' %}" class="btn btn-outline-light me-2">Войти</a>
                    <a href="{% url 'users:signup' %}" class="btn btn-light">Регистрация</a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
{% endwith %}

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
